answer_template: '校园卡充值方式：

  1. 微信/支付宝充值：关注学校一卡通公众号，绑定校园卡后在线充值

  2. 自助充值机：食堂入口处、图书馆一楼均有自助充值终端

  3. 一卡通服务中心：行政楼一楼，工作时间 8:30-17:00

  4. 银行卡自动转账：绑定银行卡后设置自动充值（余额低于20元自动充100元）

  充值到账时间：在线充值即时到账，需在终端上刷卡领取。

  '
