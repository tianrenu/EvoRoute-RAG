answer_template: '成绩复核申请流程：

  1. 时间要求：成绩公布后5个工作日内提出申请

  2. 填写《成绩复核申请表》（教务处官网下载）

  3. 提交至所在学院教务办公室

  4. 学院转交任课教师复核

  5. 复核结果在3个工作日内反馈

  注意事项：

  - 复核范围仅限漏判、错判、漏登、错登

  - 不接受对评分标准的异议

  - 每门课程仅可申请一次复核

  '
