answer_template: 'GPA（平均学分绩点）计算方法：

  GPA = Σ(课程绩点 × 课程学分) / Σ(课程学分)


  百分制与绩点对照表：

  - 90-100 分 → 4.0

  - 85-89 分 → 3.7

  - 82-84 分 → 3.3

  - 78-81 分 → 3.0

  - 75-77 分 → 2.7

  - 72-74 分 → 2.3

  - 68-71 分 → 2.0

  - 64-67 分 → 1.5

  - 60-63 分 → 1.0

  - 60 分以下 → 0


  具体换算标准以学校教务系统为准。

  '
