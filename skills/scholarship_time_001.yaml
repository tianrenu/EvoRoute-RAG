answer_template: '主要奖学金申请时间安排：

  1. 国家奖学金：每年9月中旬开始申报，10月中旬截止

  2. 国家励志奖学金：每年9月中旬开始，10月底截止

  3. 校级优秀学生奖学金：每学期末评选，次学期初公示

  4. 社会奖学金：根据捐赠方要求，一般在每年3-4月或9-10月

  具体时间以学校教务处通知为准。

  '
