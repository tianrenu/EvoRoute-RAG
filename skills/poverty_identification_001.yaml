answer_template: "贫困生认定申请流程：\n1. 准备材料：\n   - 《家庭经济困难学生认定申请表》\n   - 家庭所在地乡镇/街道出具的贫困证明\n\
  \   - 家庭收入证明材料\n2. 提交申请：每年9月开学两周内向辅导员提交材料\n3. 班级评议：班级民主评议小组进行评议\n4. 学院审核：学院学生资助工作组审核\n\
  5. 学校公示：公示5个工作日，无异议后认定生效\n认定等级分为：特别困难、困难、一般困难三档。\n"
