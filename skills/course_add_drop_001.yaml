answer_template: "选课补退选流程：\n1. 登录教务系统（jwxt.xxx.edu.cn）\n2. 进入\"选课管理\"模块\n3. 选课分三轮：\n\
  \   - 第一轮（预选）：开学前两周，按志愿选课\n   - 第二轮（正选）：开学第一周，先到先得\n   - 第三轮（补退选）：开学第二周，可补选有余量课程或退选已选课程\n\
  4. 退选操作：在\"已选课程\"中点击\"退选\"按钮\n5. 补选操作：在\"可选课程\"中搜索并选择\n注意：第三轮结束后不可再退选。\n"
